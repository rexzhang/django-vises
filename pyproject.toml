[project]
name = "django-vises"
description = "Django Vises."
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]
authors = [{ email = "rex.zhang@gmail.com" }, { name = "Rex Zhang" }]
keywords = ["django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Typing :: Typed",
]

dynamic = ["dependencies", "version"]

[build-system]
# https://peps.python.org/pep-0621
# https://setuptools.pypa.io/en/latest/userguide/quickstart.html
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "django_vises.__version__" }
dependencies = { file = "requirements.d/base.txt" }

[tool.setuptools.package-data]
django_vises = ["py.typed"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["django_vises", "examples", "tests"]
mypy_path = "examples/example_project"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "example_project.settings"

[[tool.mypy.overrides]]
# https://github.com/line1029/uuid-backport - 无 py.typed 的 mypyc 编译包
module = ["uuid_backport", "uuid_backport.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["example_project.*", "manage", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--cov=django_vises --cov-report html --ignore=tests/by_hand"
asyncio_mode = "auto"

[tool.isort]
profile = "black"

[tool.djlint]
indent_size = 2
ignore = "H030,H031,D018"
